# コミット前チェック(pre-commit)の定義
# セットアップ: uvx pre-commit install
# 全ファイルへの手動実行: uvx pre-commit run --all-files
#
# 言語非依存のチェック(衛生・シークレット検知)と、Python の lint/整形(ruff)を入れている。
# frontend/(TypeScript)の lint は npm 依存のため pre-commit には入れず、`npm run lint` で実行する。

repos:
  # 基本の衛生チェック
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace   # 行末空白の除去
      - id: end-of-file-fixer     # ファイル末尾の改行統一
      - id: check-yaml            # YAML 構文チェック
      - id: check-toml            # TOML 構文チェック
      - id: check-json            # JSON 構文チェック
        # VS Code 設定・会社配布の .claude/settings.json・TypeScript の tsconfig は
        # コメント付き(JSONC)で厳密な JSON ではないため除外
        exclude: ^(\.(vscode|claude)/|frontend/tsconfig.*\.json$)
      - id: check-merge-conflict  # コンフリクトマーカー残りの検知
      - id: check-added-large-files
      - id: detect-private-key    # 秘密鍵の混入検知

  # ※ shellcheck(シェルスクリプトの静的検査)は入れていない。shellcheck-py は導入時に GitHub から
  #   バイナリを取得するが、社内ネットワークの SSL 証明書(自己署名)で取得に失敗するため。
  #   シェルスクリプトを置くようになったら、brew 等で入れた shellcheck を repo: local で呼ぶ形で追加する
  #   (その際も .claude/ は会社配布ポリシーで編集できないため対象外にする)。

  # Python の lint と整形(設定はリポジトリ直下の ruff.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # 新しめの ruff は Markdown 内のコード例も整形するため、Python ファイルに限定する
      # (レビュー用チェックリストの NG 例などが書き換わるのを防ぐ)
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # シークレット(API キー・トークン等)のパターン検知
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
