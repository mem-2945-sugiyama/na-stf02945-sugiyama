[project]
name = "nippo-backend"
version = "0.1.0"
description = "日報アプリ nippo の API サーバー"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "icalendar>=6.0",
    # Google カレンダーの .ics は繰り返し予定を RRULE のまま出力するため、日単位への展開に使う
    "recurring-ical-events>=3.0",
    # slim イメージには OS のタイムゾーンデータがなく zoneinfo が Asia/Tokyo を解決できないため
    "tzdata",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

# ruff の設定はリポジトリ直下の ruff.toml(importer/ と共通にするため)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
